project:
  name: fru-tracker
  module: github.com/example/fru-tracker
  description: OpenCHAMI FRU tracker service with Fabrica-generated REST APIs for hardware discovery and inventory
  created: 2026-02-26T11:09:26-08:00
features:
  validation:
    enabled: true
    mode: strict
  events:
    enabled: true
    bus_type: memory
  conditional:
    enabled: true
    etag_algorithm: sha256
  auth:
    enabled: false
  security:
    authn:
      enabled: false
    authz:
      enabled: false
      mode: enforce
  storage:
    enabled: true
    type: ent
  metrics:
    enabled: false
generation:
  handlers: true
  storage: true
  client: true
  openapi: true
  events: true
  middleware: true
  reconciliation: true
