# GoReleaser configuration for fru-tracker

version: 2

before:
  hooks:
    - go mod download

builds:
  - id: fru-tracker-server-linux-amd64
    main: ./cmd/server
    binary: fru-tracker-server
    env:
      - CGO_ENABLED=1
      - CC=gcc
    goos:
      - linux
    goarch:
      - amd64

    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

  - id: fru-tracker-server-linux-arm64
    main: ./cmd/server
    binary: fru-tracker-server
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: fru-tracker
    # Renamed from `builds` per goreleaser deprecation notice; same
    # semantics. See https://goreleaser.com/deprecations#archivesbuilds.
    ids:
      - fru-tracker-server-linux-amd64
      - fru-tracker-server-linux-arm64
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  # `incpatch` requires `.Version` to be valid semver — it dies with
  # `invalid semantic version` whenever goreleaser is invoked from a
  # ref that isn't a `vX.Y.Z` tag (PR builds tagged `pr-N`, local
  # work from `main`, anything cut from a feature branch). Use a
  # template that's semver-shaped but doesn't try to do version math
  # so snapshot builds work in every state.
  version_template: "0.0.0-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

# Image-tag templates intentionally use `{{ .Tag }}` (the raw git
# tag like `v0.2.4`) rather than `{{ .Version }}` (which strips the
# `v` and would publish `0.2.4`). The integration-sandbox and other
# downstream consumers resolve the latest GitHub Release via the
# API, which returns the `tag_name` verbatim — keeping GHCR tags in
# the same shape avoids a v-prefix mismatch on pull. The OCI
# `image.version` label still uses `{{ .Version }}` since that's a
# semver value, not a tag identifier.
dockers:
  - id: fru-tracker-amd64
    ids: [fru-tracker-server-linux-amd64]
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/openchami/fru-tracker:{{ .Tag }}-amd64"
      - "ghcr.io/openchami/fru-tracker:latest-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - id: fru-tracker-arm64
    ids: [fru-tracker-server-linux-arm64]
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/openchami/fru-tracker:{{ .Tag }}-arm64"
      - "ghcr.io/openchami/fru-tracker:latest-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.licenses=MIT"

# Multi-arch manifest lists. Without both -amd64 and -arm64 image
# templates listed here, `docker pull ghcr.io/openchami/fru-tracker:vX.Y.Z`
# resolves to whichever single arch happens to be referenced, and
# linux/amd64 hosts get an `exec format error` (or, when only the
# arm64 leaf is published as the manifest itself, a confusing
# `no matching manifest for linux/amd64` — exactly the v0.2.3
# regression that sent us here).
docker_manifests:
  - name_template: "ghcr.io/openchami/fru-tracker:{{ .Tag }}"
    image_templates:
      - "ghcr.io/openchami/fru-tracker:{{ .Tag }}-amd64"
      - "ghcr.io/openchami/fru-tracker:{{ .Tag }}-arm64"

  - name_template: "ghcr.io/openchami/fru-tracker:latest"
    image_templates:
      - "ghcr.io/openchami/fru-tracker:latest-amd64"
      - "ghcr.io/openchami/fru-tracker:latest-arm64"

release:
  github:
    owner: openchami
    name: fru-tracker
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## fru-tracker {{ .Version }}

    **Release Date:** {{ .Date }}

    ### Installation

    #### Docker
    ```bash
    docker pull ghcr.io/openchami/fru-tracker:{{ .Tag }}
    ```

    #### Go Install
    ```bash
    go install [github.com/openchami/fru-tracker/cmd/server](https://github.com/openchami/fru-tracker/cmd/server)@{{ .Tag }}
    ```

  footer: |
    ---
    **Full Changelog**: https://github.com/openchami/fru-tracker/compare/{{ .PreviousTag }}...{{ .Tag }}
    **Full Changelog**: https://github.com/openchami/fru-tracker/compare/{{ .PreviousTag }}...{{ .Tag }}
