name: Codegen Check

on:
  pull_request:
    branches: [main]
    paths:
      - "apis/**"
      - "cmd/server/**"
      - "internal/middleware/**"
      - "internal/storage/**"
      - "pkg/apiversion/**"
      - "pkg/client/**"
      - "pkg/reconcilers/**"
      - "go.mod"
      - "go.sum"
      - ".fabrica.yaml"
      - "Makefile"
      - ".github/workflows/codegen-check.yaml"
  workflow_dispatch:

jobs:
  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install REUSE for generated SPDX headers
        run: pipx install reuse

      - name: Verify generated code is committed
        run: make generate-check
